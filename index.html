function recentEntries(limit=4){return allQuestions().filter(answered).sort((a,b)=>(entry(b.id).updated||0)-(entry(a.id).updated||0)).slice(0,limit)}
function home(){let d=todayQuestion(),recent=recentEntries(),progress=state.habits.length?todayDone()/state.habits.length*100:0;let skillSum=Object.values(state.skills).reduce((a,b)=>a+Number(b||0),0);
return `<div class="page-head"><div><div class="eyebrow">YOUR INNER UNIVERSE</div><h1>你的思想，正在成為你的世界。</h1><p class="subtitle">不是為了找到標準答案，而是讓每個答案經得起推敲與生活。</p></div><button class="btn ghost" data-page="archive">▤ 思想檔案</button></div>
<section class="hero"><div class="hero-content"><div class="eyebrow">THE PATH OF INNER ORDER</div><h1>在混沌裡，建自己的秩序。</h1><p>以哲學拓展視角，以人生課題確認立場；再將思考化為人格能力與每日習慣。這裡保存的不是一次測驗的結果，而是持續生長的你。</p><button class="btn gold" data-open="${safe(d.id)}">開始今日深度思考　→</button></div><div class="hero-stamp">知 · 行 · 合 · 一</div></section>
<section class="stats">${stat('已形成的思考',nAnswered(),'已留下個人見解',' / '+allQuestions().length)}${stat('今日習慣',todayDone(),`完成率 ${Math.round(progress)}%`,' / '+state.habits.length)}${stat('人格能力進階',skillSum,'30 個技能，最高各 3 階',' 階')}${stat('累積修練經驗',state.xp,`可分配 ${spendable()} XP`,' XP')}</section>
<div class="two-col"><section class="panel daily-card"><div class="row space-between"><span class="eyebrow">TODAY'S QUESTION</span><span class="tag goldtag">${safe(d.category)}</span></div><h2>${safe(d.title)}</h2><p>${safe(d.prompt)}</p><div class="row wrap"><button class="btn gold" data-open="${d.id}">與思想家對話</button><button class="btn ghost" data-page="philosophy">探索全部 84 題</button></div></section>
<section class="panel pad"><div class="section-title"><h2>今日的自我鍛鍊</h2><span class="mini-caption">${todayDone()} / ${state.habits.length}</span></div><div class="progress-line"><span style="width:${progress}%"></span></div><div class="mt12">${state.habits.slice(0,5).map((h,i)=>`<div class="habit-mini"><label>${safe(h.title)}</label><button class="check-round ${state.habitLog[`${iso()}_${h.id}`]?'done':''}" data-habit-toggle="${safe(h.id)}" aria-label="切換 ${safe(h.title)}">${state.habitLog[`${iso()}_${h.id}`]?'✓':'＋'}</button></div>`).join('')||'<p class="muted">你還沒有建立習慣。</p>'}</div><button class="btn ghost small mt12" data-page="habits">完整習慣頁 →</button></section></div>
<div class="two-col mt18"><section class="panel pad"><div class="section-title"><h2>最近思考軌跡</h2><button class="btn ghost small" data-page="archive">查看全部</button></div>${recent.length?recent.map(q=>`<div class="activity-row"><span class="activity-icon">✦</span><div class="activity-body"><strong>${safe(q.title)}</strong><small>${safe(entry(q.id).mine||'').slice(0,90)}</small></div><button class="btn ghost small tiny-btn" data-open="${q.id}">續寫</button></div>`).join(''):'<div class="empty">第一則思想紀錄還沒誕生。<br>從今天的一個提問開始。</div>'}</section><section class="panel pad"><div class="section-title"><h2>我所相信的原則</h2><button class="btn ghost small" data-page="archive">編輯原則</button></div><div class="pillars">${state.pillars.slice(0,6).map(p=>`<div class="pillar">${safe(p)}</div>`).join('')}</div><p class="note mt12">以上是可修改的思想錨點，不是人格測驗給你的標籤。</p></section></div>
<div class="quick-links"><button class="panel quick-link" data-page="philosophy"><span class="big-ico">◇</span><strong>探問哲學</strong><small>存在、自由、正義、真理、道與美</small></button><button class="panel quick-link" data-page="tree"><span class="big-ico">♧</span><strong>建構人格</strong><small>六條能力分支與實踐佐證</small></button><button class="panel quick-link" data-page="life"><span class="big-ico">◌</span><strong>面對人生</strong><small>家庭、關係、工作、金錢與告別</small></button></div>`}
function selectedQuestions(kind){let arr=[...DATA[kind],...state.customQuestions.filter(x=>x.kind===kind)];return arr.filter(q=>{let v=entry(q.id);if(category!=='全部'&&q.category!==category)return false;if(statusFilter==='已思考'&&!answered(q))return false;if(statusFilter==='未思考'&&answered(q))return false;if(statusFilter==='收藏'&&!v.favorite)return false;let hay=[q.title,q.prompt,q.category,...(q.views||[]).map(v=>v.name+' '+v.text),v.mine].join(' ').toLowerCase();return !searchTerm||hay.includes(searchTerm.toLowerCase())})}
function questionPage(kind){let ph=kind==='philosophy', cats=[...DATA.categories[kind],...new Set(state.customQuestions.filter(x=>x.kind===kind).map(x=>x.category))].filter((v,i,a)=>a.indexOf(v)===i),count=ph?DATA.philosophy.length:DATA.life.length;
return `${head(ph?'PHILOSOPHY ATLAS':'HUMAN LIFE QUESTIONS',ph?'哲學圖譜':'人生課題',ph?'14 個思想領域，整理 84 道基礎提問。比較不同立場，再寫下自己的推理。':'11 種生命處境，66 道人生提問。你不必把每個問題一次解完。',`<button class="btn gold" data-action="newQuestion" data-kind="${kind}">＋ 自訂提問</button>`)}${!ph?'<div class="life-note">人生課題沒有唯一正確解。每張卡片都能存下你現在的想法、別人的觀點與一個可實踐的小步驟。</div>':''}<div class="toolbar"><input id="qSearch" class="searchbox" placeholder="搜尋問題、哲學家或關鍵字…" value="${safe(searchTerm)}" aria-label="搜尋問題"/><select id="qStatus" aria-label="思考狀態">${['全部','已思考','未思考','收藏'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select></div><div class="filter-tabs">${['全部',...cats].map(x=>`<button class="tab ${x===category?'active':''}" data-category="${safe(x)}">${safe(x)}</button>`).join('')}</div><div id="qResults"></div>`}
function renderQuestionResults(){const target=$('#qResults');if(!target)return;let qs=selectedQuestions(page);target.innerHTML=`<div class="result-count">共 ${qs.length} 道提問 · 點選即可記錄你的觀點</div><div class="question-grid">${qs.map(q=>{let a=entry(q.id);return `<button class="panel question-card" data-open="${safe(q.id)}"><span class="row space-between"><span class="tag ${q.kind==='philosophy'?'goldtag':''}">${safe(q.category)}</span><span class="q-num">${q.id.startsWith('u')?'自訂':safe(q.id.toUpperCase())}</span></span><h3>${safe(q.title)}</h3><p>${safe(q.prompt)}</p><span class="q-card-foot">${answered(q)?'<span class="completed-mark">✓ 已留下見解</span>':'<span class="tag mutedtag">尚未思考</span>'}${a.favorite?'<span class="tag goldtag">★ 收藏</span>':''}<span class="spacer"></span><span class="muted-small">深入思考 →</span></span></button>`}).join('')}</div>${qs.length?'':'<div class="panel empty"><div class="empty-icon">◇</div>沒有符合條件的題目。試著調整搜尋或新增自己的問題。</div>'}`}
function skillsByCategory(cat){return DATA.tree.filter(s=>s.category===cat)}
function treePage(){let levels=Object.values(state.skills).reduce((a,b)=>a+Number(b||0),0);let categories=[...new Set(DATA.tree.map(s=>s.category))];let earned=state.xp;return `${head('PERSONALITY GROWTH TREE','人格建構樹','不是用測驗貼標籤，而是透過思考、實踐與能力升級，建立你想成為的人。')}<section class="skill-top">${stat('累積 XP',earned,'反思、實踐與習慣帶來的經驗')}${stat('可分配 XP',spendable(),'升級會消耗經驗點')}${stat('技能總進階',levels,'總共 30 技能 × 3 階',' / 90')}</section><div class="panel pad mb18"><div class="row space-between wrap"><div><strong>能力樹的升級規則</strong><p class="note" style="margin:5px 0 0">每項技能最多三級：覺察 → 應用 → 融會。依序需 30 / 70 / 120 XP；同分支需先點亮前一節點。每次實踐心得可獲 8 XP。</p></div><div class="tree-legend"><span>◇ 尚未解鎖</span><span>◆ 已點亮</span><span>✦ 第三級</span></div></div></div><div class="tree-branches">${categories.map((cat,j)=>`<section class="panel branch"><div class="branch-head"><h2>${BRANCH_ICONS[j]} ${safe(cat)}</h2><span class="tag goldtag">${skillsByCategory(cat).reduce((a,b)=>a+lvl(b.id),0)} / 15 階</span></div><div class="node-path">${skillsByCategory(cat).map((s,i)=>{let l=lvl(s.id),locked=s.requires&&lvl(s.requires)<1;return `<div class="node-wrap"><button class="node-click" data-skill="${s.id}" title="${safe(s.desc)}"><span class="node-circle lv${l} ${locked?'locked':''}">${l===3?'✦':l?'◆':locked?'♧':'◇'}</span><span class="node-name">${safe(s.title)}</span><span class="node-level">${l===0?(locked?'待解鎖':'可修練'):['','覺察','應用','融會'][l]}</span></button></div>`}).join('')}</div></section>`).join('')}</div>`}
function habitIcon(h,i){return HABIT_ICONS[i%HABIT_ICONS.length]}
function habitsPage(){const n=state.habits.length,done=todayDone(),ratio=n?Math.round(100*done/n):0;let week=Array.from({length:7},(_,i)=>daysBack(6-i));let last14=Array.from({length:14},(_,i)=>daysBack(13-i));return `${head('DAILY DISCIPLINE','習慣養成','用可持續的日常行動，讓抽象的人格原則真正落地。',`<button class="btn gold" data-action="newHabit">＋ 新增習慣</button>`)}<div class="habits-layout"><section><div class="section-title"><h2>今日練習清單</h2><span class="tag goldtag">完成 ${done} / ${n}</span></div>${state.habits.length?state.habits.map((h,i)=>{let c=!!state.habitLog[`${iso()}_${h.id}`];return `<article class="panel habit-card"><div class="habit-emoji">${habitIcon(h,i)}</div><div class="habit-main"><h3>${safe(h.title)}</h3><small>${safe(h.desc)}</small><div class="habit-details">${safe(h.category||'自訂')} · 連續 ${streak(h.id)} 天</div></div><div class="habit-actions"><button class="check-round ${c?'done':''}" data-habit-toggle="${safe(h.id)}" aria-label="${c?'取消':'完成'} ${safe(h.title)}">${c?'✓':'＋'}</button><button class="btn ghost small" data-habit-edit="${safe(h.id)}" title="編輯習慣">編輯</button></div></article>`}).join(''):'<div class="panel empty">尚未建立習慣，按右上角新增第一個。</div>'}<div class="notice mt18">✓ 每項習慣每天完成一次可得 10 XP。取消當日勾選時會同步扣回 10 XP。完成量以你的實際紀錄計算。</div></section><aside><section class="panel pad"><div class="section-title"><h2>近七日完成率</h2><span class="muted-small">今日 ${ratio}%</span></div><div class="habit-graph">${week.map(d=>{let c=completedHabits(d),pct=n?c/n*100:0;return `<div class="day-column"><small>${d.slice(5)}</small><div class="day-bar-bg"><div class="day-bar" style="height:${pct}%"></div></div><div class="day-dot">${c}/${n}</div></div>`}).join('')}</div><div class="habit-calendar"><strong>最近 14 天紀律足跡</strong><div class="day-dots">${last14.map(d=>{let c=completedHabits(d);return `<div class="dot ${c===0?'':c===n?'all':'some'} ${d===iso()?'today':''}" title="${d}: ${c}/${n}" aria-label="${d} 完成 ${c}/${n}"></div>`}).join('')}</div><p class="note mt12">深金色：全部完成；青綠色：部分完成。這不是懲罰表，休息也可以被安排進人生節奏。</p></div></section><section class="panel pad mt18"><div class="eyebrow">CONSISTENCY OVER PERFECTION</div><h2 style="margin:12px 0">持續，比完美更強大。</h2><p class="note">與其一次訂下不可能做到的高標準，更值得建立低摩擦、可回復的習慣。需要調整時，隨時可以編輯或移除。</p></section></aside></div>`}
function archivePage(){let qs=allQuestions().filter(answered).sort((a,b)=>(entry(b.id).updated||0)-(entry(a.id).updated||0));if(archiveTerm)qs=qs.filter(q=>(q.title+' '+entry(q.id).mine).toLowerCase().includes(archiveTerm.toLowerCase()));return `${head('YOUR THINKING ARCHIVE','思想檔案','保存觀點的演變，而不是逼自己永遠持有同一個答案。')}<div class="archive-columns"><section><div class="section-title"><h2>我的思辨紀錄</h2><span class="tag goldtag">${nAnswered()} 則</span></div><div class="archive-toolbar"><input id="archiveSearch" placeholder="搜尋我的觀點與題目…" value="${safe(archiveTerm)}" aria-label="搜尋思想檔案"/></div><div id="archiveResults">${archiveResultHTML(qs)}</div></section><aside><section class="panel pad"><div class="section-title"><h2>我的思想錨點</h2><span class="tag mutedtag">可隨時修改</span></div><p class="note">一行一個原則。當你的理解改變，就重新寫下它。</p><textarea id="pillarsText" rows="7" aria-label="我的思想原則">${safe(state.pillars.join('\n'))}</textarea><button class="btn gold mt12" data-action="savePillars">儲存我的原則</button></section><section class="panel pad mt18"><h2>資料與備份</h2><p class="note">所有紀錄儲存在目前裝置的瀏覽器內，沒有雲端同步。換裝置、清除網站資料之前，請匯出 JSON 備份。</p><div class="row wrap mt12"><button class="btn gold small" data-action="exportBackup">匯出完整備份</button><button class="btn ghost small" data-action="importBackup">匯入備份</button></div><div class="separator"></div><h3>擴充題庫</h3><p class="note">可透過 JSON 批次新增哲學或人生問題，原有題庫不受影響。</p><div class="row wrap mt12"><button class="btn soft small" data-action="importQuestions">匯入題目 JSON</button><button class="btn ghost small" data-action="exampleQuestions">下載題目範例</button></div></section><div class="notice mt18">隱私提醒：反思內容可能十分私密。請勿在共用電腦保存敏感資料；匯出的 JSON 不是加密檔案。</div></aside></div>`}
function archiveResultHTML(qs){return qs.length?qs.map(q=>{let v=entry(q.id);return `<article class="panel reflection-card"><div class="row space-between"><span class="tag ${q.kind==='philosophy'?'goldtag':''}">${safe(q.category)}</span><small>${shortDate(v.updated)}</small></div><h3>${safe(q.title)}</h3><p>${safe(v.mine).slice(0,350)}${v.mine.length>350?'…':''}</p><div class="footnote"><span>${safe(v.status||'思考中')}${v.favorite?' · ★ 已收藏':''}</span><button class="btn ghost small" data-open="${safe(q.id)}">續寫 / 對照 →</button></div></article>`}).join(''):'<div class="panel empty">目前沒有符合條件的思考紀錄。<br>你的第一個答案，值得在這裡留下。</div>'}
function updateArchive(){const x=$('#archiveResults');if(!x)return;let qs=allQuestions().filter(answered).sort((a,b)=>(entry(b.id).updated||0)-(entry(a.id).updated||0));if(archiveTerm)qs=qs.filter(q=>(q.title+' '+entry(q.id).mine).toLowerCase().includes(archiveTerm.toLowerCase()));x.innerHTML=archiveResultHTML(qs)}
function openThought(id){let q=qById(id);if(!q)return;currentThoughtId=id;renderThought();let dlg=$('#thoughtDialog');if(!dlg.open)dlg.showModal()}
function renderThought(){let q=qById(currentThoughtId);if(!q)return;let v=entry(q.id);let allV=[...(q.views||[]).map(x=>({...x,source:'歷史思想摘要'})),...((v.others||[]).map(x=>({...x,source:'自行記錄'})))];$('#thoughtDialog').innerHTML=`<div class="modal-head"><div><div class="row wrap"><span class="tag ${q.kind==='philosophy'?'goldtag':''}">${safe(q.category)}</span><span class="muted-small">${q.kind==='philosophy'?'哲學提問':'人生課題'}</span></div><h2>${safe(q.title)}</h2></div><button class="close-x" data-close="thoughtDialog" aria-label="關閉">×</button></div><div class="modal-body"><div class="thought-prompt"><strong>延伸思考</strong><div class="mt8">${safe(q.prompt)}</div></div><div class="row space-between"><h3 class="modal-subhead">① 我的見解</h3><button class="btn ghost small" data-action="toggleFavorite">${v.favorite?'★ 已收藏':'☆ 加入收藏'}</button></div><label class="label-field" for="myThought">寫下你的主張、理由、反例與可能改變想法的條件</label><textarea id="myThought" rows="6" placeholder="我目前認為……\n理由是……\n但如果出現……證據，我會重新思考。">${safe(v.mine||'')}</textarea><label class="label-field" for="thoughtStatus">我的思考階段</label><select id="thoughtStatus" class="status-select">${['思考中','暫定立場','持續修正','已形成原則'].map(s=>`<option ${s===(v.status||'思考中')?'selected':''}>${s}</option>`).join('')}</select><div class="modal-actions"><button class="btn gold" data-action="saveThought">保存我的見解</button><span class="note">第一次完成這題的見解可得 25 XP</span></div><div class="separator"></div><h3 class="modal-subhead">② 他人的見解 <span class="muted-small">${allV.length} 則</span></h3>${(q.views||[]).length?'<p class="note">思想家觀點為便於對照的簡要概括，並非原文引句，也不能取代原著。</p>':''}${allV.length?allV.map((b,i)=>`<div class="view-card ${b.source==='自行記錄'?'custom':''}"><div class="row space-between"><div><strong>${safe(b.name)}</strong> <span class="muted-small">· ${safe(b.source)}</span></div>${b.source==='自行記錄'?`<button class="btn danger small" data-other-remove="${i-(q.views||[]).length}">刪除</button>`:''}</div><p>${safe(b.text)}</p></div>`).join(''):'<p class="note">這道題尚無預設觀點。你可以收集朋友、書籍、訪談或自己的閱讀摘錄。</p>'}<div class="inline-form"><input id="otherName" placeholder="作者 / 對話者" aria-label="觀點作者" maxlength="100"/><textarea id="otherText" rows="2" placeholder="整理對方的立場、論據，必要時註明書名或來源…" aria-label="他人的觀點"></textarea><button class="btn soft" data-action="addOther">加入</button></div><div class="separator"></div><h3 class="modal-subhead">③ 知行合一 · 行動實驗</h3><p class="note">當思考只有在腦中成立，它仍是一個假說。設計一個小行動，觀察現實的回饋。</p>${q.action?`<div class="thought-prompt">建議的起步練習：${safe(q.action)}</div>`:''}<textarea id="practiceNote" rows="3" placeholder="我準備做的行動 / 事後回顧…">${safe(v.practiceNote||'')}</textarea><div class="modal-actions"><button class="btn soft" data-action="savePractice">${v.practiceDone?'✓ 已實踐（點選可修改）':'保存並標記已實踐'}</button><button class="btn ghost" data-action="savePracticeDraft">只保存行動草稿</button></div>${q.id.startsWith('u')?'<div class="separator"></div><button class="btn danger small" data-action="deleteQuestion">刪除此自訂問題</button>':''}</div>`}
function saveThought(){const text=$('#myThought')?.value.trim();if(text.length<2){toast('請至少寫下兩個字的想法。',true);return}let v=state.entries[currentThoughtId]||{},first=!(v.mine||'').trim();v.mine=text;v.status=$('#thoughtStatus').value;v.updated=Date.now();state.entries[currentThoughtId]=v;if(first)state.xp+=25;save();render();renderThought();toast(first?'想法已保存，+25 XP':'已更新你的見解')}
function favorite(){let v=state.entries[currentThoughtId]||{};v.favorite=!v.favorite;state.entries[currentThoughtId]=v;save();render();renderThought();toast(v.favorite?'已加入收藏':'已取消收藏')}
function addOther(){let n=$('#otherName')?.value.trim(),t=$('#otherText')?.value.trim();if(!n||!t){toast('請填入觀點者與其見解。',true);return}let v=state.entries[currentThoughtId]||{};v.others=[...(v.others||[]),{name:n,text:t,added:Date.now()}];v.updated=Date.now();state.entries[currentThoughtId]=v;state.xp+=10;save();render();renderThought();toast('已新增不同觀點，+10 XP')}
function removeOther(i){let v=state.entries[currentThoughtId];if(!v||!Array.isArray(v.others)||!v.others[i])return;if(!confirm('確定刪除這則觀點？'))return;v.others.splice(i,1);save();render();renderThought();toast('觀點已移除')}
function practice(done){let v=state.entries[currentThoughtId]||{},now=!!v.practiceDone;v.practiceNote=$('#practiceNote')?.value.trim()||'';if(done!==null){v.practiceDone=now?false:true;state.xp=Math.max(0,state.xp+(now?-5:5));}v.updated=Date.now();state.entries[currentThoughtId]=v;save();render();renderThought();toast(done===null?'已保存行動草稿':now?'已取消實踐紀錄':'行動實驗已記錄，+5 XP')}
function openSkill(id){if(!DATA.tree.some(s=>s.id===id))return;currentSkillId=id;renderSkill();let dlg=$('#skillDialog');if(!dlg.open)dlg.showModal()}
function renderSkill(){const s=DATA.tree.find(x=>x.id===currentSkillId);if(!s)return;let l=lvl(s.id),price=[30,70,120][l],requires=s.requires?DATA.tree.find(x=>x.id===s.requires):null,locked=requires&&lvl(requires.id)<1;let logs=(state.skillLog[s.id]||[]).slice().reverse().slice(0,5);$('#skillDialog').innerHTML=`<div class="modal-head"><div><span class="tag goldtag">${safe(s.category)}</span><h2>${safe(s.title)}</h2></div><button class="close-x" data-close="skillDialog" aria-label="關閉">×</button></div><div class="modal-body"><p>${safe(s.desc)}</p><div class="row wrap"><span class="tag goldtag">目前 ${l} / 3 階</span><span class="tag">可用 ${spendable()} XP</span></div><p class="note mt12">階段：0 尚未點亮 · 1 覺察 · 2 應用 · 3 融會</p><div class="thought-prompt">推薦實踐：${safe(s.practice)}</div><label class="label-field" for="skillEvidence">記下你真正做了什麼，以及得到什麼反思</label><textarea id="skillEvidence" rows="4" placeholder="今天練習了……\n我觀察到……"></textarea><button class="btn soft mt12" data-action="skillEvidence">保存實踐佐證（+8 XP）</button><div class="separator"></div><div class="row space-between wrap"><div><strong>${l===3?'已達本技能最高階':`下一階需 ${price} XP`}</strong><p class="note" style="margin:5px 0">${locked?`先將「${safe(requires.title)}」提升到第一階。`:'請依據真實的能力與實踐經驗自行判斷是否升級。'}</p></div><button class="btn gold" data-action="upgradeSkill" ${l===3||locked||spendable()<price?'disabled':''}>${l===3?'已達最高階':`升到 ${l+1} 階`}</button></div><div class="separator"></div><h3>近期實踐紀錄</h3>${logs.length?`<div class="skill-logs">${logs.map(x=>`<div class="log-item"><strong>${shortDate(x.date)}</strong><div>${safe(x.text)}</div></div>`).join('')}</div>`:'<p class="note">尚無實踐紀錄，從一次小練習開始。</p>'}</div>`}
function addSkillEvidence(){let t=$('#skillEvidence')?.value.trim();if(!t||t.length<3){toast('請記錄至少三個字的實踐心得。',true);return}state.skillLog[currentSkillId]=[...(state.skillLog[currentSkillId]||[]),{text:t,date:Date.now()}];state.xp+=8;save();render();renderSkill();toast('實踐已保存，+8 XP')}
function upgradeSkill(){let s=DATA.tree.find(x=>x.id===currentSkillId);if(!s)return;let l=lvl(s.id),cost=[30,70,120][l];if(l===3||!cost||spendable()<cost||(s.requires&&lvl(s.requires)<1)){toast('目前尚未符合升級條件。',true);return}state.skills[s.id]=l+1;state.spent+=cost;save();render();renderSkill();toast(`「${s.title}」進階到第 ${l+1} 階！`)}
function toggleHabit(id){if(!state.habits.some(h=>h.id===id))return;let key=`${iso()}_${id}`,v=!!state.habitLog[key];if(v)delete state.habitLog[key];else state.habitLog[key]=true;state.xp=Math.max(0,state.xp+(v?-10:10));save();render();toast(v?'已取消今日完成紀錄':'今天又向自己靠近一步，+10 XP')}
function openHabit(id=null){editingHabitId=id;let h=state.habits.find(x=>x.id===id)||{title:'',desc:'',category:'自訂'};$('#habitDialog').innerHTML=`<div class="modal-head"><h2>${id?'編輯習慣':'建立新習慣'}</h2><button class="close-x" data-close="habitDialog" aria-label="關閉">×</button></div><div class="modal-body"><label class="label-field" for="habitTitle">習慣名稱</label><input id="habitTitle" maxlength="60" value="${safe(h.title)}" placeholder="例如：每日十分鐘獨處"/><label class="label-field" for="habitDesc">完成標準</label><textarea id="habitDesc" rows="3" placeholder="怎樣算是完成一次？">${safe(h.desc)}</textarea><label class="label-field" for="habitCat">分類</label><input id="habitCat" value="${safe(h.category)}" maxlength="30"/><div class="modal-actions"><button class="btn gold" data-action="saveHabit">儲存習慣</button>${id?'<button class="btn danger" data-action="deleteHabit">刪除習慣</button>':''}</div></div>`;$('#habitDialog').showModal()}
function saveHabit(){let title=$('#habitTitle')?.value.trim(),desc=$('#habitDesc')?.value.trim(),cat=$('#habitCat')?.value.trim()||'自訂';if(!title){toast('習慣需要名稱。',true);return}let h=state.habits.find(x=>x.id===editingHabitId);if(h){Object.assign(h,{title,desc,category:cat})}else state.habits.push({id:newId('h'),title,desc,category:cat});save();$('#habitDialog').close();render();toast('習慣已保存')}
function deleteHabit(){let h=state.habits.find(x=>x.id===editingHabitId);if(!h||!confirm(`確定刪除「${h.title}」？過去打卡記錄將不再顯示。`))return;state.habits=state.habits.filter(x=>x.id!==editingHabitId);save();$('#habitDialog').close();render();toast('已刪除習慣')}
function newId(prefix){idCounter+=1;return `${prefix}${Date.now().toString(36)}_${idCounter}`}
function openCreateQuestion(kind='philosophy'){const cats=DATA.categories[kind];$('#createDialog').innerHTML=`<div class="modal-head"><h2>新增我的問題</h2><button class="close-x" data-close="createDialog" aria-label="關閉">×</button></div><div class="modal-body"><label class="label-field" for="newQKind">問題類型</label><select id="newQKind"><option value="philosophy" ${kind==='philosophy'?'selected':''}>哲學提問</option><option value="life" ${kind==='life'?'selected':''}>人生課題</option></select><label class="label-field" for="newQCat">主題分類（可自訂）</label><input id="newQCat" value="自訂" maxlength="60" list="qCats"/><datalist id="qCats">${[...DATA.categories.philosophy,...DATA.categories.life].map(c=>`<option value="${safe(c)}"></option>`).join('')}</datalist><label class="label-field" for="newQTitle">核心問題</label><input id="newQTitle" maxlength="200" placeholder="例如：成功是否意味著自由？"/><label class="label-field" for="newQPrompt">延伸思考 / 建議行動</label><textarea id="newQPrompt" rows="4" placeholder="你想怎麼追問這個問題？"></textarea><button class="btn gold mt12" data-action="saveQuestion">新增到問題庫</button></div>`;$('#createDialog').showModal()}
function saveQuestion(){let kind=$('#newQKind').value,category=$('#newQCat').value.trim()||'自訂',title=$('#newQTitle').value.trim(),prompt=$('#newQPrompt').value.trim();if(!title){toast('請輸入核心問題。',true);return}let q={id:newId('u'),kind,category,title,prompt,views:[],...(kind==='life'?{action:prompt}:{})};state.customQuestions.push(q);save();$('#createDialog').close();go(kind);openThought(q.id);toast('問題已加入題庫')}
function deleteQuestion(){let q=qById(currentThoughtId);if(!q?.id.startsWith('u'))return;if(!confirm('確定刪除這道自訂問題及其見解？此動作無法復原。'))return;state.customQuestions=state.customQuestions.filter(x=>x.id!==q.id);delete state.entries[q.id];save();$('#thoughtDialog').close();render();toast('自訂問題已刪除')}
function fileDownload(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),700)}
function backupExport(){fileDownload({app:'墨心',exportedAt:new Date().toISOString(),data:state},`墨心_完整備份_${iso()}.json`);toast('完整備份已匯出，請妥善保存。')}
function exampleQuestions(){fileDownload({questions:[{kind:'philosophy',category:'自訂哲學',title:'理解他人是否比被理解更重要？',prompt:'比較不同關係中的期待與代價。',views:[{name:'參考觀點',text:'理解是一種持續的對話，而非一次判斷。'}]},{kind:'life',category:'自訂人生',title:'我想把哪些事留給三十年後的自己？',prompt:'寫下可從今天開始的小行動。'}]},'墨心_新增題目範例.json')}
async function handleFile(evt){const file=evt.target.files?.[0];if(!file)return;let mode=evt.target.dataset.mode;try{if(file.size>12*1024*1024)throw Error('檔案超過 12MB，請拆分後匯入。');let obj=JSON.parse(await file.text());if(mode==='backup'){if(!obj||!obj.data||!obj.data.entries||!Array.isArray(obj.data.habits))throw Error('這不是有效的墨心完整備份。');if(!confirm('匯入完整備份將覆蓋目前所有紀錄。請先匯出現有資料，確定繼續？'))return;state=normalize(obj.data);save();go('archive');toast('備份匯入成功！')}else{let arr=Array.isArray(obj)?obj:obj.questions;if(!Array.isArray(arr))throw Error('題庫 JSON 需要 questions 陣列。');if(arr.length>1000)throw Error('每次最多匯入 1000 題。');let count=0;for(let x of arr){if(!x||typeof x!=='object'||!['philosophy','life'].includes(x.kind)||typeof x.title!=='string'||!x.title.trim())continue;let q={id:newId('u'),kind:x.kind,category:String(x.category||'自訂').slice(0,80),title:x.title.slice(0,300),prompt:String(x.prompt||'').slice(0,1500),views:Array.isArray(x.views)?x.views.slice(0,20).filter(v=>v&&v.name&&v.text).map(v=>({name:String(v.name).slice(0,100),text:String(v.text).slice(0,2000)})):[]};if(q.kind==='life')q.action=q.prompt;state.customQuestions.push(q);count++}if(!count)throw Error('沒有找到合法題目。每題需 kind 和 title。');save();render();toast(`成功新增 ${count} 題！`)}}catch(e){toast('匯入失敗：'+e.message,true)}finally{evt.target.value=''}}
function savePillars(){const lines=($('#pillarsText')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);state.pillars=lines;save();render();toast('思想錨點已更新')}
// Delegated actions keep newly rendered cards and dialogs interactive.
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;if(el.dataset.page){go(el.dataset.page);return}if(el.dataset.open){openThought(el.dataset.open);return}if(el.dataset.category){category=el.dataset.category;render();renderQuestionResults();return}if(el.dataset.habitToggle){toggleHabit(el.dataset.habitToggle);return}if(el.dataset.skill){openSkill(el.dataset.skill);return}if(el.dataset.habitEdit){openHabit(el.dataset.habitEdit);return}if(el.dataset.otherRemove!==undefined){removeOther(Number(el.dataset.otherRemove));return}if(el.dataset.close){$('#'+el.dataset.close)?.close();return}if(el.dataset.action){const action=el.dataset.action;switch(action){case'newQuestion':openCreateQuestion(el.dataset.kind);break;case'saveQuestion':saveQuestion();break;case'saveThought':saveThought();break;case'toggleFavorite':favorite();break;case'addOther':addOther();break;case'savePractice':practice(true);break;case'savePracticeDraft':practice(null);break;case'deleteQuestion':deleteQuestion();break;case'skillEvidence':addSkillEvidence();break;case'upgradeSkill':upgradeSkill();break;case'newHabit':openHabit();break;case'saveHabit':saveHabit();break;case'deleteHabit':deleteHabit();break;case'savePillars':savePillars();break;case'exportBackup':backupExport();break;case'exampleQuestions':exampleQuestions();break;case'importBackup':{$('#backupInput').click();break}case'importQuestions':{$('#questionInput').click();break}}}});
document.addEventListener('input',ev=>{if(ev.target?.id==='qSearch'){searchTerm=ev.target.value;renderQuestionResults()}if(ev.target?.id==='archiveSearch'){archiveTerm=ev.target.value;updateArchive()}});
document.addEventListener('change',ev=>{if(ev.target?.id==='qStatus'){statusFilter=ev.target.value;renderQuestionResults()}});
$('#backupInput').addEventListener('change',handleFile);$('#questionInput').addEventListener('change',handleFile);
$('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')});
for(const id of ['thoughtDialog','skillDialog','habitDialog','createDialog']){$('#'+id).addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()})}
render();

</script>
</body>
</html>
